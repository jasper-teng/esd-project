global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Kong's built-in Prometheus metrics endpoint
  # Exposed on the status port (8100) via KONG_STATUS_LISTEN
  - job_name: 'kong'
    static_configs:
      - targets: ['kong:8100']
    metrics_path: '/metrics'

  # Scrape Kong Admin API for additional info
  - job_name: 'kong-admin'
    static_configs:
      - targets: ['kong:8001']
    metrics_path: '/metrics'
