services:
  card_ms:
    build: 
      context: ./Atomics/Card
      dockerfile: Card.Dockerfile
    ports:
      - '3001:3001'
    env_file:
      - .env.docker
    depends_on:
      - carddb
    networks:
      - esd-network

  bus_ms:
    build:
      context: ./Legacy/Bus
      dockerfile: Bus.Dockerfile
    ports:
      - '3003:3003'
    networks:
      - esd-network

  mrt_ms:
    build:
      context: ./Legacy/Mrt
      dockerfile: Mrt.Dockerfile
    ports:
      - '3004:3004'
    networks:
      - esd-network

  lta_ms:
    build:
      context: ./Legacy/LTA
      dockerfile: LTA.Dockerfile
    ports:
      - '3007:3007'
    environment:
      - BUS_SERVICE_URL=http://bus_ms:3003
      - MRT_SERVICE_URL=http://mrt_ms:3004
      - LTA_PORT=3007
    depends_on:
      - bus_ms
      - mrt_ms
    networks:
      - esd-network

  wallet_ms:
    build: 
      context: ./Atomics/Wallet
      dockerfile: Wallet.Dockerfile
    ports:
      - '3002:3002'
    env_file:
      - .env.docker
    depends_on:
      - walletdb
    networks:
      - esd-network
  
  carddb:
    image: postgres:16
    ports:
      - '5432:5432'
    volumes:
      - ~/apps/card:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    networks:
      - esd-network
  
  walletdb:
    image: postgres:16
    ports:
      - '5433:5432'
    volumes:
      - ~/apps/wallet:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    networks:
      - esd-network

  tapin_composite:
    build:
      context: ./CompositeServices/TapIn
      dockerfile: TapIn.Dockerfile
    ports:
      - '4001:4001'
    env_file:
      - .env.docker
    depends_on:
      - card_ms
      - wallet_ms
      - trip_ms
      - manage_incomplete_composite
    networks:
      - esd-network

  manage_incomplete_composite:
    build:
      context: ./CompositeServices/ManageIncomplete
      dockerfile: ManageIncomplete.Dockerfile
    ports:
      - '4002:4002'
    env_file:
      - .env.docker
    depends_on:
      - wallet_ms
      - trip_ms
      - fare_ms
    networks:
      - esd-network

  tapout_composite:
    build:
      context: ./CompositeServices/TapOut
      dockerfile: TapOut.Dockerfile
    ports:
      - '4003:4003'
    env_file:
      - .env.docker
    depends_on:
      - card_ms
      - wallet_ms
      - trip_ms
      - fare_ms
      - lta_ms
    networks:
      - esd-network

  auto_topup_composite:
    build:
      context: ./CompositeServices/AutoTopup
      dockerfile: AutoTopup.Dockerfile
    ports:
      - '4004:4004'
    env_file:
      - .env.docker
    depends_on:
      - wallet_ms
      - payment_gateway
    networks:
      - esd-network

  trip_ms:
    build:
      context: ./Atomics/Trip Service
      dockerfile: Trip.Dockerfile
    ports:
      - '3005:3005'
    env_file:
      - .env.docker
    depends_on:
      - tripdb
    networks:
      - esd-network

  user_ms:
    build:
      context: ./Atomics/User Service
      dockerfile: User.Dockerfile
    ports:
      - '3006:3006'
    env_file:
      - .env.docker
    depends_on:
      - userdb
    networks:
      - esd-network

  fare_ms:
    build:
      context: ./Atomics/Fare Service
      dockerfile: Dockerfile
    ports:
      - '5004:5004'
    networks:
      - esd-network

  payment_gateway:
    build:
      context: ./api/PaymentGateway
      dockerfile: Dockerfile
    ports:
      - '3010:3010'
    env_file:
      - .env.docker
    depends_on:
      - wallet_ms
    networks:
      - esd-network

  tripdb:
    image: postgres:16
    ports:
      - '5434:5432'
    volumes:
      - ~/apps/trip:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    networks:
      - esd-network

  userdb:
    image: postgres:16
    ports:
      - '5435:5432'
    volumes:
      - ~/apps/user:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    networks:
      - esd-network

networks:
  esd-network:
    driver: bridge