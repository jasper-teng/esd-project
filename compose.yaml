services:

  webui:
    build:
      context: ./web-ui-nuxt
      dockerfile: WebUI.Dockerfile
    env_file:
      - .env.docker
    ports:
      - '3000:3000'
    networks:
      - esd-network

  card_ms:
    build:
      context: ./Atomics/Card
      dockerfile: Card.Dockerfile
    ports:
      - '3001:3001'
    env_file:
      - .env.docker
    depends_on:
      carddb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - esd-network

  bus_ms:
    build:
      context: ./Legacy/Bus
      dockerfile: Bus.Dockerfile
    ports:
      - '3013:3003'
    networks:
      - esd-network

  mrt_ms:
    build:
      context: ./Legacy/Mrt
      dockerfile: Mrt.Dockerfile
    ports:
      - '3014:3004'
    networks:
      - esd-network

  lta_ms:
    build:
      context: ./Legacy/LTA
      dockerfile: LTA.Dockerfile
    ports:
      - '3007:3007'
    environment:
      - BUS_SERVICE_URL=http://bus_ms:3003
      - MRT_SERVICE_URL=http://mrt_ms:3004
      - LTA_PORT=3007
    depends_on:
      - bus_ms
      - mrt_ms
    networks:
      - esd-network


  studentverificationdb:
    image: postgres:16
    ports:
      - "5436:5432"          
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=student_verification
    networks:
      - esd-network

  student-verification:
    build:
      context: ./Legacy/StudentVerification
      dockerfile: StudentVerification.Dockerfile
    ports:
      - "3020:3020"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@studentverificationdb:5432/student_verification
      - STUDENT_VERIFICATION_PORT=3020
    depends_on:
      - studentverificationdb
    networks:
      - esd-network


  wallet_ms:
    build:
      context: ./Atomics/Wallet
      dockerfile: Wallet.Dockerfile
    ports:
      - '3012:3002'
    env_file:
      - .env.docker
    depends_on:
      walletdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - esd-network
  
  carddb:
    image: postgres:16
    ports:
      - '5432:5432'
    volumes:
      - carddb_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - esd-network

  walletdb:
    image: postgres:16
    ports:
      - '5433:5432'
    volumes:
      - walletdb_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - esd-network

  seed:
    build:
      context: ./Atomics/Card
      dockerfile: Card.Dockerfile
    command: npm run seed
    env_file:
      - .env.docker
    depends_on:
      card_ms:
        condition: service_healthy
      wallet_ms:
        condition: service_healthy
    restart: "no"
    networks:
      - esd-network

  tapin_composite:
    build:
      context: ./CompositeServices/TapIn
      dockerfile: TapIn.Dockerfile
    ports:
      - '4001:4001'
    env_file:
      - .env.docker
    depends_on:
      - card_ms
      - wallet_ms
      - trip_ms
      - manage_incomplete_composite
    networks:
      - esd-network

  manage_incomplete_composite:
    build:
      context: ./CompositeServices/ManageIncomplete
      dockerfile: ManageIncomplete.Dockerfile
    ports:
      - '4002:4002'
    env_file:
      - .env.docker
    depends_on:
      - wallet_ms
      - trip_ms
      - fare_ms
      - rabbitmq
    networks:
      - esd-network

  manage_lost_card_composite:
    build:
      context: ./CompositeServices/ManageLostCard
      dockerfile: ManagelostCard.Dockerfile
    ports:
      - '4007:4007'
    env_file:
      - .env.docker
    depends_on:
      - card_ms
      - wallet_ms
      - trip_ms
      - manage_incomplete_composite
      - rabbitmq
    networks:
      - esd-network

  tapout_composite:
    build:
      context: ./CompositeServices/TapOut
      dockerfile: TapOut.Dockerfile
    ports:
      - '4003:4003'
    env_file:
      - .env.docker
    depends_on:
      - card_ms
      - wallet_ms
      - trip_ms
      - fare_ms
      - lta_ms
      - rabbitmq
    networks:
      - esd-network

  process_concession_composite:
    build:
      context: ./CompositeServices/Process Concession
      dockerfile: ProcessConcession.Dockerfile
    ports:
      - '4005:4005'
    env_file:
      - .env.docker
    depends_on:
      - card_ms
      - user_ms
      - payment_gateway
      - rabbitmq
    networks:
      - esd-network

  auto_topup_composite:
    build:
      context: ./CompositeServices/AutoTopup
      dockerfile: AutoTopup.Dockerfile
    ports:
      - '4004:4004'
    env_file:
      - .env.docker
    depends_on:
      - wallet_ms
      - payment_gateway
      - rabbitmq
    networks:
      - esd-network

  trip_ms:
    build:
      context: ./Atomics/Trip Service
      dockerfile: Trip.Dockerfile
    ports:
      - '3015:3005'
    env_file:
      - .env.docker
    depends_on:
      tripdb:
        condition: service_healthy
    networks:
      - esd-network

  user_ms:
    build:
      context: ./Atomics/User Service
      dockerfile: User.Dockerfile
    ports:
      - '3006:3006'
    env_file:
      - .env.docker
    depends_on:
      userdb:
        condition: service_healthy
    networks:
      - esd-network

  fare_ms:
    build:
      context: ./Atomics/Fare Service
      dockerfile: Dockerfile
    ports:
      - '5004:5004'
    networks:
      - esd-network

  payment_gateway:
    build:
      context: ./api/PaymentGateway
      dockerfile: Dockerfile
    ports:
      - '3010:3010'
    env_file:
      - .env.docker
    depends_on:
      - wallet_ms
    networks:
      - esd-network

  tripdb:
    image: postgres:16
    ports:
      - '5434:5432'
    volumes:
      - tripdb_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - esd-network

  userdb:
    image: postgres:16
    ports:
      - '5435:5432'
    volumes:
      - userdb_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - esd-network

  process_interim_refund_composite:
    build:
      context: ./CompositeServices/ProcessInterimRefund
      dockerfile: ProcessInterimRefund.Dockerfile
    ports:
      - '4006:4006'
    env_file:
      - .env.docker
    depends_on:
      - user_ms
      - trip_ms
      - fare_ms
      - wallet_ms
      - rabbitmq
    networks:
      - esd-network

  notification_ms:
    build:
      context: ./Atomics/Notification
      dockerfile: Dockerfile
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - QUEUE_NAME=notifications
      - OUTSYSTEMS_NOTIFICATION_URL=https://personal-pnpjth42.outsystemscloud.com/NotificationService/rest/NotificationAPI/Notify
    depends_on:
      - rabbitmq
    networks:
      - esd-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'
    networks:
      - esd-network

  ###################################
  # Kong API Gateway
  ###################################
  kong-database:
    image: postgres:16
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kongpassword
      POSTGRES_DB: kong
    ports:
      - '5437:5432'
    volumes:
      - kong_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - esd-network

  kong-migration:
    image: kong/kong-gateway:3.9
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpassword
      KONG_PG_DB: kong
      KONG_PASSWORD: admin
    depends_on:
      kong-database:
        condition: service_healthy
    restart: on-failure
    networks:
      - esd-network

  kong:
    image: kong/kong-gateway:3.9
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpassword
      KONG_PG_DB: kong
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_PASSWORD: admin
    ports:
      - '8000:8000'
      - '8001:8001'
      - '8002:8002'
      - '8100:8100'
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - esd-network

  ###################################
  # Prometheus — scrapes Kong metrics
  ###################################
  prometheus:
    image: prom/prometheus:latest
    ports:
      - '9090:9090'
    volumes:
      - ./kong/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - kong
    networks:
      - esd-network

  ###################################
  # Grafana — visualises Prometheus
  ###################################
  grafana:
    image: grafana/grafana:latest
    ports:
      - '3100:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=funfare123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./kong/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - esd-network

networks:
  esd-network:
    driver: bridge

volumes:
  carddb_data:
  walletdb_data:
  tripdb_data:
  userdb_data:
  kong_data:
  prometheus_data:
  grafana_data: